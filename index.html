<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="style.css" />
  <title>Valentine Letter for Sanya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap" />


  <title>Document</title>
</head>

<body>


<!-- MUSIC -->
<audio  autoplay = "Loop" src ="Baby I'm Yours.mp3" ></audio>>

<audio id="bg-music" src="Baby I'm Yours.mp3" loop></audio>

  <!-- Envelope Screen -->
  <div id="envelope-container">
    <img src="envelope.jpg" alt="Envelope" id="envelope" />
    <p>LETTER FOR SANYA</p>  
  </div>

  <!-- Letter Screen -->
  <div id="letter-container">
    <div class="letter-window">
      <h1 id="letter-title"> Will you be my Valentine? </h1>

      <img src="" class="cat" id="letter-cat" />

      <div class="buttons" id="letter-buttons">
        <img src="Yes.jpg" class="btn yes-btn" alt="Yes" />

        <div class="no-wrapper">
          <img src="no.jpg" class="btn no-btn" alt="No" />
        </div>
      </div>

      <p id="final-text" class="final-text" style="display: none">
        <strong>My heart is so full of you , I wouldnt call it mine anymore</strong>
      </p>
    </div>
  </div>
  <script src="scipt.js"></script>
</body>

</html>
